    db:
        image: postgres:latest
        container_name: go-cart-db
        environment:
            POSTGRES_USER: gcdba
            POSTGRES_PASSWORD: gcpwd
            POSTGRES_DB: gcdb
        ports:
            - "5432:5432"
        volumes:
            - db_data:/var/lib/postgresql

    localstack:
        image: localstack/localstack:latest
        container_name: go-cart-localstack
        environment:
            - SERVICES=s3,sqs
            - DEFAULT_REGION=us-east-1
            - DEBUG=1
            - DATA_DIR=/var/lib/localstack/data
        ports:
            - "4566:4566"
        volumes:
            - localstack_data:/var/lib/localstack/data

volumes:
    db_data:
    localstack_data:
